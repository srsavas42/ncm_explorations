[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ncm-probe"
version = "0.1.0"
description = "Frozen-checkpoint, paired hidden-single experiments for NCM Sudoku"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1", "torch>=2.6", "omegaconf>=2.3", "hydra-core>=1.3", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ncm-probe = "ncm_probe.cli:main"

[tool.setuptools.packages.find]
include = ["ncm_probe*"]

[tool.setuptools.package-data]
ncm_probe = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
